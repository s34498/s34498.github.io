<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ช่องทางการติดต่อ</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f5f5;
    }

    .contact-box {
      width: 90%;
      max-width: 450px;
      background: white;
      padding: 40px 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .contact-box h1 {
      font-size: 30px;
      margin-bottom: 10px;
      color: #222;
    }

    .contact-box p {
      color: #777;
      margin-bottom: 30px;
    }

    .contact-link {
      display: block;
      padding: 16px;
      margin: 15px 0;
      border-radius: 12px;
      text-decoration: none;
      color: white;
      font-size: 18px;
      font-weight: bold;
      transition: 0.3s;
    }

    .contact-link:hover {
      transform: translateY(-3px);
      opacity: 0.9;
    }

    /* Instagram */
    .instagram {
      background: linear-gradient(
        45deg,
        #feda75,
        #fa7e1e,
        #d62976,
        #962fbf,
        #4f5bd5
      );
    }

    /* Email */
    .email {
      background: #e74c3c;
    }

    /* LINE */
    .line {
      background: #06c755;
    }
  </style>
</head>

<body>

  <div class="contact-box">

    <h1>📩 ติดต่อเรา</h1>

    <p>สามารถติดต่อเราได้ผ่านช่องทางด้านล่าง</p>

    <!-- Instagram -->
    <a
      class="contact-link instagram"
      href="https://www.instagram.com/pnrstws_b"
      target="_blank"
      rel="noopener noreferrer"
    >
      📷 Instagram ; pnrstws_b
    </a>

    <!-- Email -->
    <a
      class="contact-link email"
      href="mailto:patnareebeam26@gmail.com"
    >
      📧 Email ; patnareebeam26@gmail.com
    </a>

    <!-- LINE -->
    <a
      class="contact-link line"
      href="https://line.me/ti/p/~112437bbp"
      target="_blank"
      rel="noopener noreferrer"
    >
      💚 LINE ; 112437bbp
    </a>

  </div>

</body>
</html>
