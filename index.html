<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio ของฉัน</title>
    <style>
        /* ตกแต่งหน้าเว็บให้ดูสวยงามเบื้องต้น */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            margin-top: 50px;
        }
        .profile-img {
            width: 200px;
            height: 200px;
            border-radius: 50%; /* ทำให้รูปเป็นวงกลม */
            object-fit: cover;
            border: 3px solid #333;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <!-- เปลี่ยนรูปภาพตรงนี้ โดยเปลี่ยน profile.jpg เป็นชื่อไฟล์รูปของคุณ -->
    <img src="profile.jpg" alt="รูปโปรไฟล์ของฉัน" class="profile-img">

    <!-- เปลี่ยนชื่อและนามสกุลของคุณตรงนี้ -->
    <h1>พัฒน์นรี แสนทวีสุข</h1>
    
    <p>ยินดีต้อนรับสู่ Portfolio ของฉัน</p>

    <!-- ลิงก์สำหรับกดไปหน้าต่อไป -->
    <a href="about.html" class="btn">คลิกเพื่อดูข้อมูลเพิ่มเติม</a>

</body>
</html>
